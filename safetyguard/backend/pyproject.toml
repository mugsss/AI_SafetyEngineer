[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safetyguard-backend"
version = "1.0.0"
description = "SafetyGuard MAS Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0,<0.112",
    "uvicorn[standard]>=0.30.0,<0.31",
    "langgraph>=0.1.0,<0.3",
    "langchain>=0.2.0,<0.4",
    "langchain-openai>=0.1.0,<0.4",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.0,<2.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.0,<4.0",
    "passlib[bcrypt]>=1.7,<2.0",
    "bcrypt>=4.0,<4.1",
    "redis>=5.0,<6.0",
    "celery>=5.0,<6.0",
    "gitpython>=3.0,<4.0",
    "python-dotenv>=1.0,<2.0",
    "httpx>=0.27.0,<1.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
